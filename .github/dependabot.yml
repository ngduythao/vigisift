version: 2

# One pull request a week for every ecosystem, so bumps don't conflict on uv.lock.
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: uv
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: weekly
    ignore:
      # Moving to a new Python (3.14 -> 3.15) is done by hand, once every
      # dependency ships wheels for it; the slim image has no compiler.
      - dependency-name: python
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
