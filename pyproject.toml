[project]
name = "vigisift"
version = "0.1.0"
description = "Multi-site CCTV alert triage on top of Frigate, with per-camera AI rules and an end-to-end eval"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "paho-mqtt>=2.1",
    "uvicorn[standard]>=0.34",
    "anthropic>=0.40",
    "redis>=5",
    "mcp>=1.20",
    "httpx>=0.28",
    "argon2-cffi>=25.1",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.9",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vigisift"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
