services:
  postgres:
    image: postgres:16.14-alpine
    environment:
      POSTGRES_DB: vigisift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vigisift"]
      interval: 5s
      timeout: 3s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "127.0.0.1:1883:1883"
      # TLS, once `make certs` has written deploy/mosquitto/conf.d/tls.conf.
      - "127.0.0.1:8883:8883"
    volumes:
      - ./deploy/mosquitto:/mosquitto/config:ro
      - ./deploy/certs:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data

  mediamtx:
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    ports:
      - "127.0.0.1:8554:8554"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:8889:8889"
      - "127.0.0.1:8189:8189/udp"
      - "127.0.0.1:9997:9997"
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./samples:/samples:ro
      - ./deploy/mediamtx/fake-camera.sh:/fake-camera.sh:ro

  # Valkey (BSD-3) instead of Redis: since 7.4 Redis moved to RSALv2/SSPL and is no longer
  # open source. Valkey speaks the Redis protocol, so the `redis` client and `redis://` URL stay.
  valkey:
    image: valkey/valkey:9.1.2-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One Frigate site for dev. The signed-in UI is at http://127.0.0.1:8971; the admin
  # password is printed in the first run's log: `docker compose logs frigate | grep -i password`.
  # Port 5000 (unauthenticated API) is open only on the compose network, for VigiSift.
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.18.2
    restart: unless-stopped
    shm_size: "256mb"
    stop_grace_period: 30s
    depends_on:
      mosquitto:
        condition: service_started
      mediamtx:
        condition: service_started
    environment:
      FRIGATE_MQTT_PASSWORD: ${FRIGATE_MQTT_PASSWORD:-frigate-demo}
      # Frigate writes the review's local time into the AI prompt, and the prompt is warier
      # at night. Without a zone the container runs on UTC, so a morning alert in UTC+7
      # reached the model as 2:30 AM. `make` passes the host's zone.
      TZ: ${TZ:-UTC}
    volumes:
      - ./deploy/frigate/config:/config
      # The CA for MQTT over TLS (template, `mqtt` block).
      - ./deploy/certs:/certs:ro
      - frigate-media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    extra_hosts:
      # Docker Desktop provides this name; Linux needs this line to call Ollama on the host.
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8971:8971"

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      mosquitto:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/vigisift
      MQTT_HOST: mosquitto
      # MQTT over TLS: MQTT_PORT=8883 MQTT_TLS=true MQTT_CA_FILE=/certs/ca.crt (after `make certs`).
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_TLS: ${MQTT_TLS:-false}
      MQTT_CA_FILE: ${MQTT_CA_FILE:-}
      REDIS_URL: redis://valkey:6379/0
      # Ollama runs on the host (the Mac's GPU), the same way Frigate calls it.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      # Dev over http://127.0.0.1. Behind HTTPS (the `tls` profile below, or your own proxy) set
      # SESSION_COOKIE_SECURE=true, PUBLIC_ORIGIN and FORWARDED_ALLOW_IPS (see README).
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./deploy/certs:/certs:ro
    ports:
      - "127.0.0.1:8000:8000"

  # HTTPS in front of the console: `make certs`, then
  # `SESSION_COOKIE_SECURE=true PUBLIC_ORIGIN=https://localhost:8443 FORWARDED_ALLOW_IPS='*' \
  #   docker compose --profile tls up -d` and open https://localhost:8443. Inside this compose
  # network only Caddy reaches the api's port, which is why '*' is acceptable here; with the api
  # reachable from elsewhere, list the proxy's address instead.
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [tls]
    depends_on:
      - api
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/certs:/certs:ro
    ports:
      - "127.0.0.1:8443:8443"

volumes:
  mosquitto-data:
  frigate-media:
